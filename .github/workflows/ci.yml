name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.25.0"
            - name: Build
              run: go build -o fortify-sca-mcp .
            - uses: actions/upload-artifact@v4
              with:
                  name: fortify-sca-mcp
                  path: fortify-sca-mcp
                  retention-days: 1

    test:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.25.0"
            - uses: actions/download-artifact@v4
              with:
                  name: fortify-sca-mcp
            - name: Test
              run: go test ./...
