variables:
  POLICY_REF: "v26.3.7"

stages:
  - build
  - test

default:
  image: dockerhub.artifactory.otxlab.net/library/golang:1.25-alpine

build:
  stage: build
  before_script:
    - apk add --no-cache git
  script:
    - go build -o fortify-sca-mcp .
  artifacts:
    paths:
      - fortify-sca-mcp
    expire_in: 1 day

test:
  stage: test
  needs:
    - job: build
      artifacts: true
  script:
    - go test ./...
